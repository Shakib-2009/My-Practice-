<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header</title>
</head>
<body>
    <header>
        
        <nav>
            <ul>
                <li><a href="#home">Home</a></li>
                <li><a href="#about">About</a></li>
                <li><a href="#contact">Contact</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section id="home"><h1>Home</h1><p>HTML navigation practice.</p></section>
        <section id="about"><h2>About</h2><p>A simple header and navigation example.</p></section>
        <section id="contact"><h2>Contact</h2><p>This is a practice section.</p></section>
    </main>
</body>
 <style>
      nav{
        background-color: khaki;
      }
      ul{
        list-style-type: none;
        margin: 0;
        padding: 0;
                                                                                                 
      }
      li{
        display: inline-block;
        margin-right: 20px;
      }
 </style>
</html>
