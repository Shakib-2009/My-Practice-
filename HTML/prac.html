<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <div class="container">
    <div id="myDiv">   <div id="ball"></div> </div>
  
    </div>
</body>
<style>
    body {
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
    }
 
    .container {
        position: absolute;
        width: 400px;
        height: 400px;
        align-items: center;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);

    }
    #ball {
        position: absolute;
        width: 50px;
        height: 50px;
        background-color: red;
        BORDER-radius: 50%;
        top: 0;
        left: 0;
        animation: ballAnimation 2s infinite linear;
        POSITION: relative;
        top:-70px;
        left: -10px;

    }
    
    #myDiv {
        width: 30px;
        height: 300px;
        background-color: rgb(0, 0, 0);
        animation: myAnimation 2s infinite;
    }

    @keyframes myAnimation {
       0%{transform: rotate(150deg)}
       /* 16%{transform: rotate(180deg)}
       32%{transform: rotate(180deg)}
       48%{transform: rotate(260deg)} */
       50%{transform: rotate(220deg)}

       100%{transform: rotate(150deg)}
    
    }
    @keyframes ballAnimation {
           0%{transform: rotate(150deg)}
       /* 16%{transform: rotate(180deg)}
       32%{transform: rotate(180deg)}
       48%{transform: rotate(260deg)} */
       50%{transform: rotate(220deg)}

       100%{transform: rotate(150deg)}
    }
</style>
</html>
